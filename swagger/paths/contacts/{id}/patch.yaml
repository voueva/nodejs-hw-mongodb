# swagger/paths/contacts/{id}/patch.yaml
tags:
  - Contacts
summary: Update contact (partial)
operationId: updateContact
description: 'Partially update contact fields. Send only the fields you want to change. userId is determined from bearerAuth.'
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
    description: ID of the contact to update
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        # no required fields here — partial update
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380501234567'
          email:
            description: "Contact's email"
            type: string
            format: email
            example: 'john.doe@example.com'
          isFavourite:
            description: 'Whether contact is favourite'
            type: boolean
            example: false
          contactType:
            description: "Contact's type"
            type: string
            enum: ['work', 'home', 'personal']
            example: 'personal'
          photo:
            description: "Contact's photo (binary)"
            type: string
            format: binary
responses:
  '200':
    description: Successfully updated contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated the contact!
  '400':
    description: Bad request
  '404':
    description: Contact not found

